<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Variant B6 — Split Deck · gpio-companion</title>
<style>
:root{--bg:#090b10;--side:#0d1118;--rail:#06080c;--card:#111722;--panel:#0a0e15;--line:rgba(255,255,255,.08);
--txt:#e9eef4;--mut:#8595a8;--acc:#00d4ff;--acc2:#a78bfa;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--r:8px;
--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font:13px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--txt)}
.app{height:100dvh;overflow:hidden;display:flex;flex-direction:column}
.top{height:42px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--side);border-bottom:1px solid var(--line)}
.pal{flex:1;max-width:520px;margin:0 auto;display:flex;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--acc);border-radius:7px;padding:5px 10px;color:var(--mut);font-size:12.5px;cursor:pointer}
.pal b{color:var(--acc);font-family:var(--mono);font-size:11px;border:1px solid var(--acc);border-radius:4px;padding:0 5px}
.mid{flex:1;min-height:0;display:flex}
.rail{width:58px;flex-shrink:0;background:var(--rail);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;border-right:1px solid var(--line)}
.rail button{width:46px;height:46px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mut);font-size:15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.rail button small{font-size:8.5px;font-weight:800;letter-spacing:.02em}
.rail button[aria-pressed="true"]{background:var(--card);color:var(--acc);border-color:var(--line)}
.side{width:225px;flex-shrink:0;background:var(--side);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
.side h4{margin:8px 4px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-family:var(--mono)}
.tree{border-radius:6px;padding:6px 8px;cursor:pointer;display:flex;gap:8px;align-items:center}
.tree:hover{background:var(--card)} .tree.sel{background:var(--card);box-shadow:inset 2px 0 0 var(--acc)}
.tree small{color:var(--mut);font-family:var(--mono);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}.live{background:var(--ok)}.off{background:var(--mut)}.pend{background:var(--warn)}
.main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.split{flex:1;min-height:0;display:flex}
.col{flex:1;min-width:0;overflow-y:auto;padding:12px 14px}
.col:first-child{border-right:1px solid var(--line)}
.col.focus{box-shadow:inset 0 2px 0 var(--acc)}
.colhead{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--mut);margin-bottom:8px}
.colhead .kbd{margin-left:auto}
kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--mut);background:var(--panel)}
.code{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;overflow-x:auto;color:#c9d4e0}
.code .k{color:var(--acc2)} .code .f{color:var(--acc)} .code .c{color:var(--mut)} .code .n{color:var(--ok)}
.bread{height:180px;border-radius:var(--r);background:repeating-linear-gradient(0deg,transparent 0 12px,rgba(0,212,255,.12) 12px 13px),repeating-linear-gradient(90deg,transparent 0 12px,rgba(0,212,255,.12) 12px 13px),#0d1620;display:grid;place-items:center;color:var(--mut);font-family:var(--mono);font-size:11px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card h3{margin:0 0 6px;font-size:13px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;font-size:12px;font-family:var(--mono)}
.kv dt{color:var(--mut)} .kv dd{margin:0;word-break:break-all;font-size:11.5px}
input[type=text],input[type=password]{background:var(--panel);border:1px solid var(--line);color:var(--txt);border-radius:7px;padding:7px 10px;font-size:12.5px;font-family:var(--mono);width:100%}
label{display:block;font-size:11.5px;color:var(--mut);margin:8px 0 3px;font-family:var(--mono)}
.panel{height:var(--dockH,150px);flex-shrink:0;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:64px}
.grip{height:10px;flex-shrink:0;margin-top:-10px;cursor:ns-resize;display:flex;align-items:center;justify-content:center;touch-action:none;position:relative;z-index:5}
.grip::after{content:"";width:56px;height:4px;border-radius:99px;background:var(--line)}
.grip:hover::after,.grip.drag::after{background:var(--acc)}
.ptabs{display:flex;gap:2px;padding:4px 8px 0;font-family:var(--mono);font-size:11.5px}
.ptabs button{border:0;background:transparent;color:var(--mut);padding:6px 10px;cursor:pointer;border-bottom:2px solid transparent;font-family:inherit}
.ptabs button[aria-selected="true"]{color:var(--acc);border-bottom-color:var(--acc)}
.pbody{flex:1;overflow-y:auto;padding:8px 14px;font-family:var(--mono);font-size:12px;color:var(--mut)}
.pbody .g{color:var(--ok)} .pbody .c{color:var(--acc)} .pbody .w{color:var(--warn)}
.insp{width:230px;flex-shrink:0;background:var(--side);border-left:1px solid var(--line);overflow-y:auto;padding:12px}
.insp h4{margin:2px 0 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-family:var(--mono)}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:7px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.btn.primary{background:linear-gradient(90deg,var(--acc),var(--acc2));border:0;color:#04121a;font-weight:800}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btnrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--mut);font-family:var(--mono)}
.chip.g{color:var(--ok);border-color:var(--ok)} .chip.w{color:var(--warn);border-color:var(--warn)}
.status{height:28px;flex-shrink:0;display:flex;align-items:center;gap:14px;padding:0 12px;background:var(--rail);border-top:1px solid var(--line);font-size:11.5px;color:var(--mut);font-family:var(--mono)}
.status .ok{color:var(--ok)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;font-family:var(--mono)}
.seg button{border:0;background:transparent;color:var(--mut);padding:4px 10px;cursor:pointer;font-size:11px;font-weight:700;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--acc);color:#04121a}
.palette{position:fixed;inset:0;display:none;place-items:start center;padding-top:14vh;background:rgba(0,0,0,.6);z-index:50}
.palette.open{display:grid}
.palbox{width:min(560px,92vw);background:var(--card);border:1px solid var(--acc);border-radius:12px;overflow:hidden}
.palbox input{width:100%;border:0;background:transparent;color:var(--txt);padding:14px;font-size:14px;outline:none;font-family:var(--mono)}
.cmd{display:flex;justify-content:space-between;padding:9px 14px;font-size:13px;cursor:pointer;border-top:1px solid var(--line)}
.cmd:hover,.cmd.hot{background:var(--panel)} .cmd kbd{font-family:var(--mono);font-size:11px;color:var(--mut)}
.expert-only{display:none}body.expert .expert-only{display:revert}
table.plain{width:100%;border-collapse:collapse;font-size:12.5px}
table.plain th,table.plain td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line)}
table.plain th{color:var(--mut);font-size:10.5px;text-transform:uppercase;font-family:var(--mono)}
.doc{font-size:13px} .doc h4{margin:8px 0 4px} .doc p{color:var(--mut);margin:4px 0}
.toast{position:fixed;left:50%;bottom:44px;transform:translateX(-50%);background:var(--acc);color:#04121a;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;font-family:var(--mono)}
.toast.show{opacity:1}
.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--txt);border-radius:7px;padding:5px 10px;font-size:14px;cursor:pointer;display:none}
.brand-short{display:none}
@media (max-width:1100px){.split{flex-direction:column}.col:first-child{border-right:0;border-bottom:1px solid var(--line)}.insp{display:none}}
@media (max-width:900px){.side{width:190px}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30;display:none}
.scrim.open{display:block}
@media (max-width:640px){
 .top{height:48px;padding:0 8px 0 10px;padding-top:env(safe-area-inset-top);gap:6px}
 .top .pal,.top .chip,.brand-full{display:none}
 .brand-short{display:inline}
 .iconbtn{display:block}
 .seg button{padding:4px 8px;font-size:10.5px}
 .rail{width:50px}
 .rail button{width:42px;height:42px}
 .side{position:fixed;top:0;bottom:0;left:0;width:min(260px,78vw);z-index:31;background:var(--side);
  border-right:1px solid var(--line);transform:translateX(-102%);transition:transform .22s ease;
  padding:calc(8px + env(safe-area-inset-top)) 8px calc(8px + env(safe-area-inset-bottom))}
 .side.open{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.5)}
 .status{font-size:10px;gap:8px;overflow:hidden;white-space:nowrap}
 .status span:nth-child(3){display:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="iconbtn" id="drawerBtn" aria-label="Open menu">☰</button><b style="color:var(--acc)">◈</b><b class="brand-full">gpio-companion</b><b class="brand-short">gpio</b><span class="chip">B6 · SPLIT DECK</span>
    <div class="pal" id="palBtn"><b>⌘K</b> pages, boards, flash…</div>
    <span style="flex:1"></span>
    <button class="iconbtn" id="palBtnM" aria-label="Search / commands">🔍</button>
    <div class="seg"><button id="mEasy" aria-pressed="true">EASY</button><button id="mExpert" aria-pressed="false">EXPERT</button></div>
  </div>
  <div class="mid">
    <nav class="rail">
      <button data-pane="project" aria-pressed="true" title="Project">📁<small>Work</small></button>
      <button data-pane="devices" aria-pressed="false" title="Devices">🧠<small>Fleet</small></button>
      <button data-pane="t3" aria-pressed="false" title="T3">💻<small>T3</small></button>
      <button data-pane="profile" aria-pressed="false" title="Profile">👤<small>You</small></button>
    </nav>
    <aside class="side" id="side"></aside>
    <main class="main">
      <div class="split" id="split"></div>
      <div class="panel" id="dock">
        <div class="grip" id="grip" title="drag to resize · double-click resets"></div>
        <div class="ptabs" id="ptabs"></div>
        <div class="pbody" id="pbody"></div>
      </div>
    </main>
    <aside class="insp" id="insp"></aside>
  </div>
  <div class="status" id="status"></div>
</div>
<div class="scrim" id="scrim"></div>
<div class="palette" id="palette"><div class="palbox">
  <input id="palInput" placeholder="> type to filter…" /><div id="cmds"></div>
</div></div>
<div class="toast" id="toast"></div>
<script>
const REPOS=[
 {id:"line-follower",br:"feat/ir-sensors",up:"2h ago",files:["host/line-sensor.c","breadboard/diagram.json","pcb/circuit.json"],
  code:'<span class="c">// runs on header via POST /v1/run</span>\n<span class="k">#include</span> &lt;gpio-host.h&gt;\n<span class="k">void</span> <span class="f">setup</span>() {\n  pinMode(<span class="n">7</span>, INPUT);  <span class="c">// IR left</span>\n  pinMode(<span class="n">12</span>, OUTPUT); <span class="c">// motor en</span>\n  Serial.begin(<span class="n">115200</span>);\n}\n<span class="k">void</span> <span class="f">loop</span>() {\n  <span class="k">int</span> err = readIR() - <span class="n">3500</span>;\n  drive(err); <span class="c">// 120Hz</span>\n}'},
 {id:"weather-station",br:"main",up:"1d ago",files:["host/dht22.c","breadboard/diagram.json","pcb/circuit.json"],
  code:'<span class="c">// DHT22 → Serial 115200</span>\n<span class="k">#include</span> &lt;gpio-host.h&gt;\n<span class="k">void</span> <span class="f">setup</span>() { Serial.begin(<span class="n">115200</span>); }\n<span class="k">void</span> <span class="f">loop</span>() {\n  <span class="k">float</span> t = readTemp(<span class="n">4</span>);\n  Serial.println(t); delay(<span class="n">2000</span>);\n}'},
 {id:"blink-lab",br:"main",up:"4d ago",files:["host/blink.c","firmware/blink.ino"],
  code:'<span class="k">void</span> <span class="f">setup</span>() { pinMode(<span class="n">11</span>, OUTPUT); }\n<span class="k">void</span> <span class="f">loop</span>() {\n  digitalWrite(<span class="n">11</span>, HIGH); delay(<span class="n">500</span>);\n  digitalWrite(<span class="n">11</span>, LOW); delay(<span class="n">500</span>);\n}'}];
const BOARDS=[
 {id:"bench-pi",model:"Orange Pi 3 LTS",uuid:"3f9a…bench-01",url:"https://api-bench-01.gpio-companion.com",cls:"live",state:"live",note:"hub-live · loop 120Hz",extra:"proxy connected (Uno · 57600)"},
 {id:"rover",model:"Raspberry Pi 4",uuid:"7c21…rover-02",url:"https://api-rover-02.gpio-companion.com",cls:"off",state:"offline",note:"last seen 2d ago",extra:"needs Update companion"},
 {id:"lab-pi",model:"OPi Zero 2",uuid:"b812…lab-03",url:"—",cls:"pend",state:"pending",note:"transfer awaiting owner",extra:"owner approval needed"}];
const DEVPAGES=[["overview","🧠","Overview"],["pair","＋","Pair board"],["wifi","📶","WiFi over BLE"],["docs","📄","Docs"],["debug","🛠","Debug"],["notifs","🔔","Requests · 1"]];
const DOCS=[
 {id:"gpio-host",t:"Run C on the header",b:"POST /v1/run { dir } compiles Arduino-style C on the Pi and runs setup/loop on companion GPIO via libgpiod. Sketches live in ~/projects/<repo>/host/<name>/."},
 {id:"gpio-arduino-proxy",t:"Firmata proxy",b:"Check GET /v1/arduino-proxy first. If connected, the USB Arduino wins: host/arduino-proxy-<name>/ sketches talk Firmata (digital/PWM/ADC, I2C/SPI/UART). Flash with POST /v1/flash/proxy."},
 {id:"pinout-orangepi",t:"Orange Pi 40-pin",b:"Physical pins 1–40. Power/GND refused. Some SoC lines unresolved live — the API refuses them. 3V3/5V never driven."},
 {id:"pinout-raspberrypi",t:"Raspberry Pi 40-pin",b:"Physical 27–28 (ID EEPROM) refused. PUT /v1/gpio is one-shot testing only — drive via gpio-host sketches."},
 {id:"gpio-breadboard",t:"Breadboard maps",b:"Wokwi diagram.json with gpio-companion-header + optional gpio-arduino-proxy. Verify pulses jumpers and paints net overlays."}];
const SESSIONS=[["IR tuning","~/projects/line-follower","active"],["PCB review","weather-station · pcb/", "idle"],["console watch","Serial 115200 ⏺","idle"]];
let pane="project",repo=0,file=0,board=0,devSub="overview",doc=0,sess=0,youSub="account",ptab="console",docQ="";
const PAN={console:'<span class="g">[ok]</span> setup() 41ms · loop 120Hz<br><span class="c">[ser]</span> IR=0110 err=-1 → 180/150 ⏺',
 gpio:'pin 7 HIGH · pin 12 LOW · SDA/SCL pulled HIGH · 3V3 ok',
 flash:'<span class="g">[done]</span> proxy v2.3 → Uno · 12.4KB/32KB (38%)',
 problems:'<span class="w">[warn]</span> diagram.json: net LED-R2 drive-only → verify stays honest-unknown'};
const TABS=[["console","CONSOLE ⏺"],["gpio","GPIO"],["flash","FLASH"],["problems","PROBLEMS · 1"]];
function esc(s){return s;}
function btnRow(list){return `<div class="btnrow">${list.map(b=>`<button class="btn${b.p?' primary':''}${b.d?' danger':''}" data-x="${b.t}">${b.t}</button>`).join('')}</div>`;}
function wireX(root){root.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>toast(x.dataset.x+' ✓'));}

/* ---------- sidebar ---------- */
function sidebar(){const el=document.getElementById('side');let h='';
 if(pane==="project"){h='<h4>// repos</h4>'+REPOS.map((r,i)=>`<div class="tree${i===repo?' sel':''}" data-r="${i}">📦<span>${r.id}<br><small>⎇ ${r.br} · ${r.up}</small></span></div>`).join('')
  +'<h4>// files</h4>'+REPOS[repo].files.map((f,i)=>`<div class="tree${i===file?' sel':''}" data-f="${i}">📄<span>${f}</span></div>`).join('')
  +`<div class="tree" data-x="Create project">＋<span>New project</span></div>`;}
 if(pane==="devices"){h='<h4>// boards</h4>'+BOARDS.map((b,i)=>`<div class="tree${i===board?' sel':''}" data-b="${i}"><span class="dot ${b.cls}"></span><span>${b.id}<br><small>${b.note}</small></span></div>`).join('')
  +'<h4>// device pages</h4>'+DEVPAGES.map(d=>`<div class="tree${devSub===d[0]?' sel':''}" data-d="${d[0]}">${d[1]}<span>${d[2]}</span></div>`).join('');}
 if(pane==="t3"){h='<h4>// sessions</h4>'+SESSIONS.map((s,i)=>`<div class="tree${i===sess?' sel':''}" data-s="${i}">💻<span>${s[0]}<br><small>${s[1]} · ${s[2]}</small></span></div>`).join('');}
 if(pane==="profile"){h='<h4>// sections</h4>'+[["account","👤","Account"],["credits","💳","Credits · $12.40"],["keys","🔑","Keys & tunnels"]].map(s=>`<div class="tree${youSub===s[0]?' sel':''}" data-y="${s[0]}">${s[1]}<span>${s[2]}</span></div>`).join('');}
 el.innerHTML=h;
 el.querySelectorAll('[data-r]').forEach(x=>x.onclick=()=>{repo=+x.dataset.r;file=0;sync();});
 el.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{file=+x.dataset.f;sync();});
 el.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{board=+x.dataset.b;devSub="overview";sync();});
 el.querySelectorAll('[data-d]').forEach(x=>x.onclick=()=>{devSub=x.dataset.d;sync();});
 el.querySelectorAll('[data-s]').forEach(x=>x.onclick=()=>{sess=+x.dataset.s;sync();});
 el.querySelectorAll('[data-y]').forEach(x=>x.onclick=()=>{youSub=x.dataset.y;sync();});
 el.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>toast(x.dataset.x+' ✓'));}

/* ---------- stage ---------- */
function projectStage(){const r=REPOS[repo],isCode=r.files[file].match(/\.(c|ino)$/);
 const L=`<div class="colhead">◧ ${r.files[file]} <span class="kbd"><kbd>⌘1</kbd></span></div>`+
  (isCode?`<pre class="code">${r.code}</pre>`:`<div class="bread">${r.files[file]} viewer · overlay ✓</div>`)+
  btnRow([{t:"Run on board",p:1},{t:"Flash Arduino"},{t:"Verify circuit"},{t:"Save to GitHub"},{t:"Stop sketch"}]);
 const R=`<div class="colhead">◨ LIVE · ${BOARDS[board].id} <span class="kbd"><kbd>⌘2</kbd></span></div>
  <div class="card">IR <b style="color:var(--ok)">0110</b> · err <b>-1</b> · PWM <b>180/150</b> <span class="chip g">⏺ live</span>
  <div class="bread">wokwi · header + IR array + L298N</div></div>
  <div class="card expert-only" style="font-family:var(--mono);font-size:11.5px;color:var(--mut)">⎇ ${r.br} · newest-commit default · focus reloads branches<br>net LED-R2 drive-only → unknown (honest)</div>`;
 return `<div class="col focus" id="colL">${L}</div><div class="col" id="colR">${R}</div>`;}
function boardCard(b){return `<dl class="kv"><dt>Board</dt><dd>${b.id} · ${b.model}</dd><dt>Status</dt><dd>${b.state} · ${b.note}</dd><dt class="expert-only">UUID</dt><dd class="expert-only">${b.uuid}</dd><dt class="expert-only">URL</dt><dd class="expert-only">${b.url}</dd><dt>Companion</dt><dd>${b.extra}</dd></dl>`;}
function devicesStage(){const b=BOARDS[board];
 if(devSub==="overview")return `<div class="col focus"><div class="colhead">◧ BOARD · ${b.id}</div><div class="card">${boardCard(b)}${btnRow([{t:"Open Code",p:1},{t:"Flash as proxy"},{t:"T3 pair"},{t:"Live GPIO"},{t:"Unpair",d:1}])}</div></div>
  <div class="col"><div class="colhead">◨ FLEET</div>${BOARDS.map((x,i)=>`<div class="card" style="${i===board?'border-color:var(--acc)':''}"><b>${x.id}</b> <span class="chip${x.cls==='live'?' g':x.cls==='pend'?' w':''}">${x.state}</span><br><small style="color:var(--mut)">${x.model} · ${x.note}</small></div>`).join('')}</div>`;
 if(devSub==="pair")return `<div class="col focus"><div class="colhead">◧ PAIR · claim a board</div><div class="card"><h3>Claim board</h3>
  <label>PAIRING UUID</label><input type="text" value="3f9a…new-04"><label>PAIRING KEY</label><input type="password" value="••••••••">
  <label>DEVICE URL (from BLE / first-setup)</label><input type="text" value="https://api-new-04.gpio-companion.com">
  ${btnRow([{t:"Claim board",p:1}])}<p class="expert-only" style="font-family:var(--mono);font-size:11px;color:var(--mut)">POST /v1/pairing/claim · owned boards pend until transfer accepted</p></div></div>
  <div class="col"><div class="colhead">◨ HOW</div><div class="card doc"><h4>1 · Power + BLE</h4><p>Dashboard fetches UUID/key/Device URL over signed BLE (localhost-only).</p><h4>2 · Claim</h4><p>Signed claim binds the board to your account. T3 pair code + QR follows.</p></div></div>`;
 if(devSub==="wifi")return `<div class="col focus"><div class="colhead">◧ WIFI · signed nmcli</div><div class="card"><h3>Push WiFi to ${b.id}</h3>
  <label>SSID</label><input type="text" value="bench-lab"><label>PSK</label><input type="password" value="••••••••••">
  ${btnRow([{t:"Send via BLE",p:1},{t:"Copy sign envelope"}])}<p style="font-family:var(--mono);font-size:11px;color:var(--mut)">GATT forward · timestamp/nonce signed · iOS: paste into LightBlue/nRF</p></div></div>
  <div class="col"><div class="colhead">◨ LINK</div><div class="card"><span class="chip g">● BLE connected</span><br><small style="color:var(--mut)">rssi -61dBm · mtu 185 · Ethernet/TTY still work</small></div></div>`;
 if(devSub==="docs"){const list=DOCS.filter(d=>(d.id+d.t).toLowerCase().includes(docQ.toLowerCase()));const d=list[Math.min(doc,list.length-1)]||DOCS[0];
  return `<div class="col"><div class="colhead">◧ DOCS · ${BOARDS[board].id} family</div><input type="text" id="docQ" placeholder="search docs…" value="${docQ}"><div style="height:8px"></div>
  ${list.map(x=>`<div class="tree${x.id===d.id?' sel':''}" data-doc="${x.id}">📄<span>${x.id}<br><small>${x.t}</small></span></div>`).join('')||'<p style="color:var(--mut)">no match</p>'}</div>
  <div class="col focus"><div class="colhead">◨ READER · ${d.id}</div><div class="card doc"><h3>${d.t}</h3><p>${d.b}</p><p class="expert-only" style="font-family:var(--mono);font-size:11px">FR bodies under documentation/user/fr/ · readers at /devices/docs?id=${d.id}</p></div></div>`;}
 if(devSub==="debug")return `<div class="col focus"><div class="colhead">◧ DEBUG · ${b.id} · redacted 24h</div><div class="card"><pre class="code"><span class="c">[updater]</span> pull ok · skills synced\n<span class="g">[gpio]</span> pin 7 probe HIGH (one-shot)\n<span class="w">[cleanup]</span> journals 41M/64M · tmp pruned</pre>${btnRow([{t:"Start update",p:1},{t:"Load disk snapshot"}])}</div></div>
  <div class="col"><div class="colhead">◨ DISK</div><div class="card"><span class="chip g">/ 61%</span> <span class="chip">/tmp 4%</span><br><small style="color:var(--mut)">apt/bun/npm caches pruned hourly · boot + 24h updater</small></div></div>`;
 return `<div class="col focus"><div class="colhead">◧ REQUESTS · pending transfers</div><div class="card"><b>lab-pi</b> <span class="chip w">PENDING</span><br><small style="color:var(--mut)">OPi Zero 2 · requested by lab-mate · 2d ago</small>${btnRow([{t:"Accept transfer",p:1},{t:"Reject",d:1}])}</div></div>
  <div class="col"><div class="colhead">◨ POLICY</div><div class="card doc"><p>Unpair/transfer revokes T3 auth + clears GitHub creds on the Pi immediately.</p></div></div>`;}
function t3Stage(){const s=SESSIONS[sess];return `<div class="col focus"><div class="colhead">◧ T3 · ${s[0]}</div>
  <div class="card" style="min-height:260px;display:grid;place-items:center;color:var(--mut)">keep-alive agent — ${s[1]}<br><span class="chip">never lost on tab switch</span></div>
  ${btnRow([{t:"Open Code",p:1},{t:"Open in new tab"}])}</div>
  <div class="col"><div class="colhead">◨ SESSIONS · ${BOARDS[board].id}</div>${SESSIONS.map((x,i)=>`<div class="card" style="${i===sess?'border-color:var(--acc)':''}"><b>${x[0]}</b><br><small style="color:var(--mut)">${x[1]} · ${x[2]}</small></div>`).join('')}</div>`;}
function profileStage(){
 if(youSub==="credits")return `<div class="col focus"><div class="colhead">◧ CREDITS</div><div class="card"><h3>Balance · <b style="font-size:22px">$12.40</b></h3>
  <small style="color:var(--mut)">Workers AI list × 1.25 · 402 when empty · PayPal immediate capture</small>${btnRow([{t:"Buy $5"},{t:"Buy $10",p:1},{t:"Buy $25"},{t:"Buy $50"}])}</div></div>
  <div class="col"><div class="colhead">◨ USAGE</div><div class="card"><table class="plain"><tr><th>Call</th><th>Cost</th></tr><tr><td>glm-5.3 · 12k in</td><td>$0.018</td></tr><tr><td>glm-5.3 · 4k in</td><td>$0.007</td></tr></table></div></div>`;
 if(youSub==="keys")return `<div class="col focus"><div class="colhead">◧ KEYS & TUNNELS</div><div class="card"><dl class="kv"><dt>GitHub</dt><dd>shpaw415 · PAT in KV ✓</dd><dt class="expert-only">Ed25519</dt><dd class="expert-only">device key · api-bench-01</dd><dt>Tunnel</dt><dd>api-bench-01 · t3-bench-01</dd></dl>${btnRow([{t:"Push GitHub to Pi",p:1},{t:"Rotate device key"}])}</div></div>
  <div class="col"><div class="colhead">◨ POLICY</div><div class="card doc"><p>Pi verifies via public key from <span style="font-family:var(--mono)">GET /api/device-public-key</span>. Private key never committed.</p></div></div>`;
 return `<div class="col focus"><div class="colhead">◧ ACCOUNT</div><div class="card"><h3>shpaw415</h3><dl class="kv"><dt>Login</dt><dd>GitHub OAuth ✓</dd><dt>Locale</dt><dd>English / Français</dd><dt>Theme</dt><dd>follows system</dd></dl>${btnRow([{t:"Switch to Français"},{t:"Sign out"}])}</div></div>
  <div class="col"><div class="colhead">◨ OVERVIEW</div><div class="card"><b>3 boards</b> · <b>3 repos</b> · <b>$12.40</b><br><small style="color:var(--mut)">Easy mode on · switch with ⌘K or the seg control</small></div></div>`;}
function stage(){const el=document.getElementById('split');
 el.innerHTML=pane==="project"?projectStage():pane==="devices"?devicesStage():pane==="t3"?t3Stage():profileStage();
 wireX(el);
 const dq=document.getElementById('docQ');if(dq){dq.oninput=()=>{docQ=dq.value;doc=0;const pos=dq.selectionStart;stage();const nq=document.getElementById('docQ');nq.focus();nq.setSelectionRange(pos,pos);};}
 el.querySelectorAll('[data-doc]').forEach(x=>x.onclick=()=>{doc=DOCS.findIndex(d=>d.id===x.dataset.doc);sync();});}

/* ---------- dock / inspector / status ---------- */
function dock(){const t=document.getElementById('ptabs');
 t.innerHTML=TABS.filter(x=>x[0]!=="problems"||document.body.classList.contains('expert')).map(x=>`<button data-p="${x[0]}" aria-selected="${x[0]===ptab}">${x[1]}</button>`).join('');
 t.querySelectorAll('button').forEach(x=>x.onclick=()=>{ptab=x.dataset.p;sync();});
 document.getElementById('pbody').innerHTML=ptab==="problems"?PAN.problems:PAN[ptab];}
function inspector(){const el=document.getElementById('insp');const b=BOARDS[board];
 if(pane==="t3"){el.innerHTML=`<h4>Session · ${b.id}</h4><div class="card"><b>${SESSIONS[sess][0]}</b><div style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:4px">${SESSIONS[sess][1]}</div><div class="btnrow"><button class="btn primary" data-x="Open Code">OPEN CODE</button></div></div>`;}
 else if(pane==="profile"){el.innerHTML=`<h4>You</h4><div class="card"><b style="font-size:20px">$12.40</b> <span class="chip">credits</span><div class="btnrow"><button class="btn primary" data-x="Buy $10">TOP UP</button></div></div><div class="card"><b>Boards</b><div style="font-family:var(--mono);font-size:11px;color:var(--mut)">3 paired · 1 pending</div></div>`;}
 else{el.innerHTML=`<h4>Target · ${b.id}</h4><div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><b>${b.id}</b><span class="dot ${b.cls}"></span></div>
  <div style="font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:4px">${b.model}<br>${b.state} · ${b.note}</div>
  <div class="btnrow"><button class="btn primary" data-x="Run on board">RUN</button><button class="btn" data-x="Stop sketch">STOP</button></div></div>
  <div class="card"><b>Sketch</b><div class="btnrow"><button class="btn" data-x="host/line-sensor">host/…</button><button class="btn" data-x="Flash Arduino">FLASH</button><button class="btn" data-x="Verify circuit">VERIFY</button></div></div>`;}
 wireX(el);}
function status(){const label={project:`${REPOS[repo].id} · ⎇ ${REPOS[repo].br}`,devices:`${BOARDS[board].id} · ${devSub}`,t3:`${SESSIONS[sess][0]} · keep-alive`,profile:`shpaw415 · ${youSub}`}[pane];
 document.getElementById('status').innerHTML=`<span class="ok">● LIVE</span><span>${label}</span><span class="expert-only">signed 12ms · GLM-5.3</span><span style="flex:1"></span><span>⌘1 ⌘2 panes · ⌘K cmds</span>`;}
function sync(){sidebar();stage();dock();inspector();status();
 document.querySelectorAll('.rail button').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.pane===pane)));}
document.querySelectorAll('.rail button').forEach(x=>x.onclick=()=>{pane=x.dataset.pane;sync();});
function focusCol(w){document.getElementById('colL')?.classList.toggle('focus',w==='L');document.getElementById('colR')?.classList.toggle('focus',w==='R');}

/* ---------- palette ---------- */
const CMDS=[["Go: Work / repos","project split view","W"],["Go: Fleet overview","boards detail","D"],["Go: Pair board","claim flow","P"],["Go: WiFi over BLE","push SSID","I"],["Go: Docs","reader + search","O"],["Go: Debug","logs + disk","G"],["Go: Requests","transfers","Q"],["Go: T3 sessions","keep-alive","T"],["Go: Profile","account/credits/keys","U"],["Run on board","host sketch → header","R"],["Flash Arduino","proxy Uno","F"],["Verify circuit","continuity overlay","V"],["Save to GitHub","push feat/*","S"],["Buy $10","credits top-up","$"]];
const pal=document.getElementById('palette'),pi=document.getElementById('palInput'),cmds=document.getElementById('cmds');
function go(c){const t=c[0];
 if(t.startsWith("Go:")){if(t.includes("Work"))pane="project";else if(t.includes("Fleet")){pane="devices";devSub="overview";}
  else if(t.includes("Pair")){pane="devices";devSub="pair";}else if(t.includes("WiFi")){pane="devices";devSub="wifi";}
  else if(t.includes("Docs")){pane="devices";devSub="docs";}else if(t.includes("Debug")){pane="devices";devSub="debug";}
  else if(t.includes("Requests")){pane="devices";devSub="notifs";}else if(t.includes("T3"))pane="t3";else if(t.includes("Profile"))pane="profile";
  sync();}}
function drawCmds(f=''){cmds.innerHTML='';CMDS.filter(c=>(c[0]+c[1]).toLowerCase().includes(f.toLowerCase())).forEach((c,i)=>{const d=document.createElement('div');
 d.className='cmd'+(i===0?' hot':'');d.innerHTML=`<span>${c[0]} <small style="color:var(--mut)">· ${c[1]}</small></span><kbd>⌘${c[2]}</kbd>`;
 d.onclick=()=>{pal.classList.remove('open');go(c);toast(c[0].replace('Go: ','')+' ✓');};cmds.appendChild(d);});}
pi.oninput=()=>drawCmds(pi.value);
pi.onkeydown=(e)=>{if(e.key==='Enter'){const h=cmds.querySelector('.cmd');if(h)h.click();}};
function openPal(){pal.classList.add('open');pi.value='';drawCmds();pi.focus();}
function closeDrawer(){document.getElementById('side').classList.remove('open');document.getElementById('scrim').classList.remove('open');}
document.getElementById('drawerBtn').onclick=()=>{document.getElementById('side').classList.add('open');document.getElementById('scrim').classList.add('open');};
document.getElementById('scrim').onclick=closeDrawer;
document.getElementById('side').addEventListener('click',e=>{if(e.target.closest('.tree')&&window.innerWidth<=640)closeDrawer();});
document.getElementById('palBtn').onclick=openPal;
document.getElementById('palBtnM').onclick=openPal;
pal.onclick=(e)=>{if(e.target===pal)pal.classList.remove('open');};
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();pal.classList.toggle('open');pi.value='';drawCmds();pi.focus();}
 if((e.metaKey||e.ctrlKey)&&e.key==='1'){e.preventDefault();focusCol('L');}if((e.metaKey||e.ctrlKey)&&e.key==='2'){e.preventDefault();focusCol('R');}
 if(e.key==='Escape')pal.classList.remove('open');});

/* ---------- dock resize / modes ---------- */
(function(){const dock=document.getElementById('dock'),grip=document.getElementById('grip');
 const saved=parseInt(localStorage.getItem('b6-dockH')||'150',10);
 if(saved>=64&&saved<=480)dock.style.setProperty('--dockH',saved+'px');
 let y0=0,h0=0;
 grip.addEventListener('pointerdown',e=>{y0=e.clientY;h0=dock.getBoundingClientRect().height;grip.classList.add('drag');grip.setPointerCapture(e.pointerId);e.preventDefault();});
 grip.addEventListener('pointermove',e=>{if(!grip.classList.contains('drag'))return;dock.style.setProperty('--dockH',Math.min(480,Math.max(64,Math.round(h0+(y0-e.clientY))))+'px');});
 grip.addEventListener('pointerup',()=>{grip.classList.remove('drag');localStorage.setItem('b6-dockH',String(Math.round(dock.getBoundingClientRect().height)));});
 grip.addEventListener('dblclick',()=>{dock.style.setProperty('--dockH','150px');localStorage.setItem('b6-dockH','150');});})();
const mE=document.getElementById('mEasy'),mX=document.getElementById('mExpert');
function setMode(x){document.body.classList.toggle('expert',x);mE.setAttribute('aria-pressed',String(!x));mX.setAttribute('aria-pressed',String(x));sync();}
mE.onclick=()=>setMode(false);mX.onclick=()=>setMode(true);
const toastEl=document.getElementById('toast');let tt;
function toast(m){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>toastEl.classList.remove('show'),1600);}
drawCmds();sync();
</script>
</body>
</html>
